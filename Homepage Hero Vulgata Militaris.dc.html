<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:.85} }
    body{margin:0}
  </style>
</helmet>
<div style="width:1920px; height:1080px; position:relative; background:#1c1712; overflow:hidden; font-family:'Public Sans',sans-serif; box-sizing:border-box;">

  <div style="position:absolute; inset:0; background:
    radial-gradient(ellipse 1400px 900px at 50% 40%, rgba(209,164,78,0.07), transparent 60%),
    radial-gradient(ellipse 900px 700px at 15% 90%, rgba(0,0,0,0.5), transparent 60%),
    radial-gradient(ellipse 900px 700px at 85% 5%, rgba(0,0,0,0.5), transparent 60%);
  "></div>

  <div style="position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay; background-image: repeating-linear-gradient(0deg, #d1a44e 0px, transparent 1px 3px), repeating-linear-gradient(90deg, #d1a44e 0px, transparent 1px 3px);"></div>

  <img src="assets/gerolamo-crop.png" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:1400px; height:auto; opacity:0.16; filter:grayscale(1) sepia(0.5) brightness(1.1) contrast(1.05); mix-blend-mode:luminosity; user-select:none; pointer-events:none;" alt="">

  <div style="position:absolute; inset:60px; border:1px solid rgba(209,164,78,0.35);"></div>
  <div style="position:absolute; inset:72px; border:1px solid rgba(209,164,78,0.18);"></div>

  <div style="position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 160px; box-sizing:border-box;">

    <div style="font-family:'Public Sans',sans-serif; font-size:20px; letter-spacing:0.42em; text-transform:uppercase; color:#d1a44e; font-weight:500; margin-bottom:36px;">Lessico storico-filologico</div>

    <h1 style="font-family:'Source Serif 4',serif; font-size:128px; font-weight:600; color:#f6f2ea; margin:0; line-height:1.02; letter-spacing:0.01em;">VVLGATA<br>MILITARIS</h1>

    <div style="display:flex; align-items:center; gap:22px; margin:46px 0 46px;">
      <div style="width:180px; height:1px; background:linear-gradient(90deg, transparent, #8a5a1f);"></div>
      <div style="width:9px; height:9px; transform:rotate(45deg); background:#d1a44e;"></div>
      <div style="width:180px; height:1px; background:linear-gradient(270deg, transparent, #8a5a1f);"></div>
    </div>

    <p style="font-family:'Source Serif 4',serif; font-style:italic; font-size:34px; color:#e9dfc8; max-width:1100px; line-height:1.5; margin:0 0 20px; animation:flicker 6s ease-in-out infinite;">
      &ldquo;Induite vos arma Dei, ut possitis stare adversus insidias diaboli.&rdquo;
    </p>
    <div style="font-family:'Public Sans',sans-serif; font-size:17px; letter-spacing:0.12em; text-transform:uppercase; color:#a68a55;">Ephesios VI, 11 &middot; Biblia Sacra Vulgata</div>

  </div>

  <div style="position:absolute; bottom:44px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:14px; z-index:2;">
    <div style="width:26px; height:1px; background:#8a5a1f;"></div>
    <div style="font-family:'Public Sans',sans-serif; font-size:13px; letter-spacing:0.3em; text-transform:uppercase; color:#6f6455;">Vulgata Militaris &mdash; Edizione digitale</div>
    <div style="width:26px; height:1px; background:#8a5a1f;"></div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}"></script>
</body>
</html>
