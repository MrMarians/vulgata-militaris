name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      # Second site (Italian, generated by lemmario_latino/12_sito.py) served under /it/.
      # Must run after the main build, which empties public/.
      - name: Build Quartz (Vulgata militaris, /it/)
        # The Italian site needs its own baseUrl (.../it): page scripts (graph view) derive
        # the page slug from the URL minus the base path. Locale switches the interface to Italian.
        run: |
          sed -i -e 's#^\(\s*baseUrl: .*[^/]\)\s*$#\1/it#' -e 's#locale: en-US#locale: it-IT#' quartz.config.yaml
          grep -q 'baseUrl: .*/it$' quartz.config.yaml
          npx quartz build -d content-vulgata -o public/it
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
